version: 2
sources:
  - name: raw
    schema: raw
    description: Fixed synthetic retail data, never real customer records.
    tables:
      - name: customers
      - name: orders
      - name: products
      - name: order_items
models:
  - name: stg_customers
    columns:
      - name: customer_id
        data_tests: [not_null, unique]
  - name: stg_products
    columns:
      - name: product_id
        data_tests: [not_null, unique]
  - name: stg_orders
    columns:
      - name: order_id
        data_tests: [not_null, unique]
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments: {to: "ref('stg_customers')", field: customer_id}
      - name: order_status
        data_tests:
          - accepted_values:
              arguments: {values: [completed, cancelled]}
  - name: stg_order_items
    columns:
      - name: order_item_id
        data_tests: [not_null, unique]
      - name: order_id
        data_tests:
          - not_null
          - relationships:
              arguments: {to: "ref('stg_orders')", field: order_id}
      - name: product_id
        data_tests:
          - not_null
          - relationships:
              arguments: {to: "ref('stg_products')", field: product_id}
  - name: dim_customers
    columns:
      - name: customer_id
        data_tests: [not_null, unique]
  - name: dim_products
    columns:
      - name: product_id
        data_tests: [not_null, unique]
  - name: fct_orders
    columns:
      - name: order_id
        data_tests: [not_null, unique]
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments: {to: "ref('dim_customers')", field: customer_id}
  - name: fct_order_items
    columns:
      - name: order_item_id
        data_tests: [not_null, unique]
      - name: order_id
        data_tests:
          - not_null
          - relationships:
              arguments: {to: "ref('fct_orders')", field: order_id}
      - name: product_id
        data_tests:
          - not_null
          - relationships:
              arguments: {to: "ref('dim_products')", field: product_id}
      - name: line_total
        data_tests: [not_null]
  - name: order_detail_mart
    columns:
      - name: order_item_id
        data_tests: [not_null, unique]
  - name: olap_sales_by_day
    columns:
      - name: order_date
        data_tests: [not_null, unique]
