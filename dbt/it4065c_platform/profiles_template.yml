it4065c_platform:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('IT4065C_DB_HOST', 'localhost') }}"
      user: "{{ env_var('IT4065C_DB_USER') }}"
      password: "{{ env_var('IT4065C_DB_PASSWORD') }}"
      port: "{{ env_var('IT4065C_DB_PORT', '5432') | int }}"
      dbname: "{{ env_var('IT4065C_DB_NAME', 'it4065c') }}"
      schema: "{{ env_var('IT4065C_DB_SCHEMA', 'student') }}"
      threads: 2
      keepalives_idle: 0
      connect_timeout: 10
      sslmode: prefer
