name: Reproduce the course
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ubuntu:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Diagnose installation prerequisites
        run: python3 scripts/preflight.py --offline
      - name: Install as a new student
        run: bash scripts/setup.sh
      - name: Test configuration boundaries
        run: .venv/bin/python -m unittest discover -s tests -v
      - name: Execute all labs twice and test failure recovery
        run: .venv/bin/python scripts/verify.py
      - name: Rehearse student test discovery after path migration
        run: |
          mkdir -p dbt/it4065c_platform/student_tests
          cp labs/core/lab03-modeling-quality/lab3_guided_test.sql dbt/it4065c_platform/student_tests/lab3_guided_daily_orders.sql
          cat > dbt/it4065c_platform/student_tests/lab3_my_sales_rule.sql <<'SQL'
          select order_date, gross_sales
          from {{ ref('olap_sales_by_day') }}
          where gross_sales is null or gross_sales < 0
          SQL
          .venv/bin/python scripts/course.py lab 3
          .venv/bin/python labs/core/lab03-modeling-quality/check_test_results.py
      - name: Verify optional ingestion and safe publication
        run: |
          .venv/bin/python scripts/optional_labs.py catalog
          .venv/bin/python scripts/optional_labs.py promotion
          .venv/bin/python scripts/optional_labs.py promotion
      - name: Verify optional isolated infrastructure experiments twice
        run: |
          sudo apt-get install -y openssl
          for pass in 1 2; do
            for experiment in audit transfer tls; do
              .venv/bin/python scripts/infrastructure_labs.py "$experiment"
            done
          done
      - name: Rehearse a non-default configuration
        env:
          IT4065C_DB_NAME: alternate_course
          IT4065C_DB_USER: alternate_builder
          IT4065C_DB_SCHEMA: learner_one
        run: |
          .venv/bin/python scripts/course.py bootstrap
          .venv/bin/python scripts/course.py all
      # Never upload .env, logs, dbt target/manifest or learner submissions.
