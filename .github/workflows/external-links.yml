name: Public external-link report
on:
  schedule:
    - cron: '17 11 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check only tracked public Markdown
        run: |
          mkdir -p .site-build
          python3 -m scripts.check_external_links > .site-build/external-links.md
          cat .site-build/external-links.md >> "$GITHUB_STEP_SUMMARY"
      # No artifact upload, automatic issue creation, or PR gate on remote uptime.
