<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="850" viewBox="0 0 1500 850" role="img" aria-labelledby="title desc">
<title id="title">Lab 4: focus the documentation graph</title>
<desc id="desc">Annotated teaching reference, not an execution screenshot. Equivalent commands and explanations appear in the lab guide.</desc>
<rect width="1500" height="100%" fill="#f4f7fb"/>
<text x="35" y="50" font-family="sans-serif" font-size="29" fill="#12304a">Lab 4: focus the documentation graph</text>
<rect x="25" y="85" width="1450" height="125" rx="8" fill="white" stroke="#acbac7"/>
<text x="45" y="114" font-family="sans-serif" font-size="22" fill="#075b76">1. Open the graph</text>
<text x="45" y="150" font-family="monospace" font-size="17" fill="#182430">Documentation page: select the graph icon in the lower-right corner.</text>
<text x="45" y="185" font-family="sans-serif" font-size="19" fill="#334557">Keep the documentation server running while using the browser.</text>
<rect x="25" y="225" width="1450" height="125" rx="8" fill="white" stroke="#acbac7"/>
<text x="45" y="254" font-family="sans-serif" font-size="22" fill="#075b76">2. Set the graph filter</text>
<text x="45" y="290" font-family="monospace" font-size="17" fill="#182430">--select: +stg_orders+</text>
<text x="45" y="325" font-family="sans-serif" font-size="19" fill="#334557">The plus signs include upstream and downstream dependencies around stg_orders.</text>
<rect x="25" y="365" width="1450" height="125" rx="8" fill="white" stroke="#acbac7"/>
<text x="45" y="394" font-family="sans-serif" font-size="22" fill="#075b76">3. Apply the selection</text>
<text x="45" y="430" font-family="monospace" font-size="17" fill="#182430">Click Update Graph.</text>
<text x="45" y="465" font-family="sans-serif" font-size="19" fill="#334557">Find raw.orders -&gt; stg_orders -&gt; fct_orders.</text>
<rect x="25" y="505" width="1450" height="125" rx="8" fill="white" stroke="#acbac7"/>
<text x="45" y="534" font-family="sans-serif" font-size="22" fill="#075b76">4. Follow both reporting branches</text>
<text x="45" y="570" font-family="monospace" font-size="17" fill="#182430">fct_orders -&gt; order_detail_mart; fct_orders -&gt; olap_sales_by_day</text>
<text x="45" y="605" font-family="sans-serif" font-size="19" fill="#334557">Filtering hides other dependencies; it does not remove them from the project.</text>
<rect x="25" y="645" width="1450" height="125" rx="8" fill="white" stroke="#acbac7"/>
<text x="45" y="674" font-family="sans-serif" font-size="22" fill="#075b76">5. Return to the full graph</text>
<text x="45" y="710" font-family="monospace" font-size="17" fill="#182430">Clear --select, then click Update Graph.</text>
<text x="45" y="745" font-family="sans-serif" font-size="19" fill="#334557">You can also search the model catalog or use the text paths in the lab.</text>
<text x="35" y="833" font-family="sans-serif" font-size="16" fill="#334557">Teaching reference | Isaac K. Nti | Use copyable commands and submission requirements in the lab guide.</text>
</svg>
