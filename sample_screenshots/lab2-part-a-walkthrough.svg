<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="850" viewBox="0 0 1500 850" role="img" aria-labelledby="title desc">
<title id="title">Lab 2: guided Part A</title>
<desc id="desc">Annotated teaching reference, not an execution screenshot. Equivalent commands and explanations appear in the lab guide.</desc>
<rect width="1500" height="100%" fill="#f4f7fb"/>
<text x="35" y="50" font-family="sans-serif" font-size="29" fill="#12304a">Lab 2: guided Part A</text>
<rect x="25" y="85" width="1450" height="125" rx="8" fill="white" stroke="#acbac7"/>
<text x="45" y="114" font-family="sans-serif" font-size="22" fill="#075b76">1. Run the baseline</text>
<text x="45" y="150" font-family="monospace" font-size="17" fill="#182430">.venv/bin/python scripts/course.py lab 2</text>
<text x="45" y="185" font-family="sans-serif" font-size="19" fill="#334557">PASS confirms technical checks. Continue with the guided activity.</text>
<rect x="25" y="225" width="1450" height="125" rx="8" fill="white" stroke="#acbac7"/>
<text x="45" y="254" font-family="sans-serif" font-size="22" fill="#075b76">2. Inspect the register</text>
<text x="45" y="290" font-family="monospace" font-size="17" fill="#182430">.venv/bin/python scripts/query.py labs/practice/inspect_register.sql</text>
<text x="45" y="325" font-family="sans-serif" font-size="19" fill="#334557">Initially: customers.email and orders.total_amount. Existing entries are preserved.</text>
<rect x="25" y="365" width="1450" height="125" rx="8" fill="white" stroke="#acbac7"/>
<text x="45" y="394" font-family="sans-serif" font-size="22" fill="#075b76">3. Copy the worked SQL</text>
<text x="45" y="430" font-family="monospace" font-size="17" fill="#182430">cp -i labs/core/lab02-classification/lab2_guided_insert.sql .local/worked-classification.sql</text>
<text x="45" y="465" font-family="sans-serif" font-size="19" fill="#334557">Create .local first. Read the file in Nano; Part A uses the supplied example unchanged.</text>
<rect x="25" y="505" width="1450" height="125" rx="8" fill="white" stroke="#acbac7"/>
<text x="45" y="534" font-family="sans-serif" font-size="22" fill="#075b76">4. Execute and inspect</text>
<text x="45" y="570" font-family="monospace" font-size="17" fill="#182430">.venv/bin/python scripts/query.py .local/worked-classification.sql</text>
<text x="45" y="605" font-family="sans-serif" font-size="19" fill="#334557">Then repeat the inspection command. The guided customers.created_at entry should appear.</text>
<rect x="25" y="645" width="1450" height="125" rx="8" fill="white" stroke="#acbac7"/>
<text x="45" y="674" font-family="sans-serif" font-size="22" fill="#075b76">5. Check preservation</text>
<text x="45" y="710" font-family="monospace" font-size="17" fill="#182430">.venv/bin/python scripts/course.py lab 2</text>
<text x="45" y="745" font-family="sans-serif" font-size="19" fill="#334557">Inspect again: the same three teaching entries remain. Part B adds your own decision.</text>
<text x="35" y="833" font-family="sans-serif" font-size="16" fill="#334557">Teaching reference | Isaac K. Nti | Use copyable commands and submission requirements in the lab guide.</text>
</svg>
